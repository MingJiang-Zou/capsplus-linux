# CI：只跑标准库能跑的东西。
#
# 三条刻意的设计（改这个文件前先读）：
#   1. **不装 python3-gi**。ubuntu-latest 默认就没有 PyGObject，测试套件必须在
#      "没有 gi" 的机器上也能收集 + 跑完（界面用例自己 skip）。这条由
#      `tests/test_no_gi_smoke.py` 守着 —— 谁在测试模块顶层裸写 `import gi`，CI 就红。
#   2. **不碰 /etc、不用 sudo**。`capsplus apply` 要写 /etc/keyd，CI 只跑单测；
#      真机端到端验收（`tools/e2e/check_mappings.py`）需要 root + /dev/uinput，不进 CI。
#   3. **界面测试默认关**。它们会真弹窗（会抢正在用人手里的键盘焦点），
#      要跑就 `CAPSPLUS_GUI=1` 且在虚拟显示下：
#        xvfb-run -a env -u WAYLAND_DISPLAY CAPSPLUS_GUI=1 python3 -m unittest discover -s tests

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]     # 下限 3.11：用了标准库 tomllib
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 语法层面全仓过一遍（含 bin/ 之外的所有 .py；bin/ 下的入口没有 .py 后缀，
      # 由单测里"子进程跑真入口"那条判据覆盖，见 tests/test_settings_window.py）
      - name: compileall
        run: python3 -m compileall -q .

      - name: 全量单测（无 python3-gi / 无显示服务器 / 无 sudo）
        run: python3 -m unittest discover -s tests -v

  # ── 界面测试专用 job ────────────────────────────────────────────────
  # 为什么单开一个：上面那个 job 刻意不装 python3-gi（守"没有 gi 也要能收集"的契约），
  # 代价是 35 条真起窗的界面用例在 CI 里全 skip —— 那等于界面行为从来没被 CI 验过。
  # 这里装上 gi + GTK3 的 gir，在 Xvfb 虚拟显示里把它们**真跑一遍**（拿覆盖率，不是假绿）。
  #
  # 两个必须是"外部设置"的细节（进程内补救都太晚，实测过）：
  #   - `env -u WAYLAND_DISPLAY`：不摘掉它，libwayland 会连真实 Wayland 桌面。
  #   - `GDK_BACKEND=x11` 必须在启动解释器**之前**设进环境：GDK 读它比 Python 早。
  gui-tests:
    name: 界面测试（Xvfb + PyGObject）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠ **不要用 setup-python**：`python3-gi` 装在系统 `/usr/lib/python3/dist-packages`，
      # setup-python 那个 pyenv 解释器看不见它 → `import gi` 失败 → 35 条界面用例全 skip，
      # 而 job 照样显示 success（2026-10-16 首跑就是这么假绿的）。ubuntu-latest 系统 python
      # 是 3.12，满足本仓 ≥3.11 的下限，直接用系统解释器。
      - name: 诊断解释器与 gi 是否可用（假绿过一次，这里必须把根因打出来）
        run: |
          python3 -V
          python3 -c "import sys; print('sys.path 里有 dist-packages:', any('dist-packages' in p for p in sys.path))"
          python3 -c "import gi; print('gi OK ->', gi.__file__)"

      - name: 装 PyGObject 与 GTK3 的 gir（界面测试要用）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 gir1.2-pango-1.0

      - name: 虚拟显示里真跑界面测试
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            env -u WAYLAND_DISPLAY GDK_BACKEND=x11 CAPSPLUS_GUI=1 \
            python3 -m unittest discover -s tests -v

  # 扩展与装机件：这些是 **JS / shell / systemd 单元**，Python 判据碰不到它们。
  # 2026-10-16 出过两次现场事故都属这一类：
  #   * 扩展写成模块级 `export function enable`（GNOME 45+ 要 `export default class`）
  #     ⇒ shell 报 `not a constructor`，扩展**静默不加载**，用户只看到"还是新窗口"；
  #   * Qbar 手拼 JSON 把 Python 的 None 写进状态文件 ⇒ status 读不了。
  # 语法与形状这一层 CI 拦得住，运行时行为（GNOME 版本差异）拦不住 —— 别指望它替代重登验收。
  assets-check:
    name: 扩展与装机件体检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 扩展 JS 必须是合法 ESM，且用 GNOME 45+ 的默认类导出
        run: |
          set -eu
          for f in extensions/*/extension.js; do
            cp "$f" /tmp/ext-check.mjs
            node --check /tmp/ext-check.mjs
            grep -q 'export default class' "$f" || { echo "✗ $f 少了 export default class（GNOME 50 会静默不加载）"; exit 1; }
            if grep -qE '^export function (enable|disable)' "$f"; then
              echo "✗ $f 用了模块级 export function —— 旧形态，shell 会报 not a constructor"; exit 1; fi
            echo "✓ $f"
          done

      - name: metadata.json 合法、uuid 等于目录名、shell-version 非空
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          bad = 0
          for d in sorted(pathlib.Path("extensions").glob("*")):
              if not d.is_dir():
                  continue
              meta = json.loads((d / "metadata.json").read_text(encoding="utf-8"))
              if meta.get("uuid") != d.name:
                  print(f"✗ uuid {meta.get('uuid')!r} != 目录名 {d.name!r}"); bad += 1
              if not meta.get("shell-version"):
                  print(f"✗ {d}: shell-version 空着"); bad += 1
              print(f"✓ {d.name}: uuid 对、shell-version={meta['shell-version']}")
          sys.exit(1 if bad else 0)
          EOF

      - name: 装机脚本按自己的 shebang 过语法检查（dash 不是 bash，数组会炸）
        run: |
          set -eu
          for f in tools/*.sh; do
            interp=$(head -1 "$f" | sed 's/^#!//' | tr -d ' ')
            case "$interp" in *sh) ;; *) continue ;; esac
            "$interp" -n "$f" && echo "✓ $f（$interp -n）"
          done

      - name: systemd 单元至少是 key=value 的形状（装上去起不来更难查）
        run: |
          python3 - <<'EOF'
          import pathlib, sys
          bad = 0
          for f in sorted(pathlib.Path("packaging").glob("*.service")):
              for ln, line in enumerate(f.read_text(encoding="utf-8").splitlines(), 1):
                  t = line.strip()
                  if not t or t.startswith("#"):
                      continue
                  if t.startswith("[") and t.endswith("]"):
                      continue
                  if "=" not in t:
                      print(f"✗ {f}:{ln} 不像单元行：{t}"); bad += 1
              print(f"✓ {f}")
          sys.exit(1 if bad else 0)
          EOF
